version = 1

SPDX-PackageName = "voxel_engine"
SPDX-PackageSupplier = "voxel-engine contributors"
SPDX-PackageDownloadLocation = "https://github.com/gusahlg/voxel-engine"

[[annotations]]
path = [
  ".codex",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "deny.toml",
  "build.rs",
  "crates/**/*.rs",
  "crates/**/Cargo.toml",
  "flake.lock",
  "flake.nix",
  "nix-run.sh",
  "scripts/**",
  "src/**/*.rs",
  "tests/**/*.rs",
  "shaders/**/*.slang",
  "shaders_spv/**",
  "tools/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 voxel-engine contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [
  "AGENTS.md",
  "README.md",
  "CONTRIBUTING.md",
  "CONTRIBUTORS.md",
  "LICENSE.md",
  "SECURITY.md",
  "THIRD_PARTY.md",
  "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 voxel-engine contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
